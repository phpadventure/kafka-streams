services:
  kafka:
    build: .
    #image: apache/kafka:4.3.1
    container_name: my-kafka-broker
    ports:
      - "9094:9094"
    networks:
      - kafka-net
    environment:
      # кастомні топіки, comma separated list
      KAFKA_BOOTSTRAP_TOPICS: "reactive-kafka-test"

      # Налаштування KRaft (Обов'язкові для версії 4.x)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@my-kafka-broker:29093

      # Мережеві лісенери (Внутрішній для Connect, Зовнішній для вашого ПК)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://my-kafka-broker:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Додаткові базові ліміти для стабільності
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  kafka-connect-standalone-worker:
    build:
      context: ./connector
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    networks:
      - kafka-net
  kafka-connect-distributed-worker:
    build:
      context: ./connector
      dockerfile: DistributedWorker.Dockerfile
    ports:
      - "8084-8086:8083"
    deploy:
      replicas: 3
    networks:
      - kafka-net
  kafka-connect-distributed-setup:
    image: curlimages/curl:latest
    volumes:
      - ./connector/configure-connector-for-distributed-worker.sh:/app/configure-connector-for-distributed-worker.sh
    depends_on:
      - kafka-connect-distributed-worker
    command: >
      /bin/sh -c "
      echo '=== START SETUP CONTAINER ===';
      echo 'Checking network connection to worker...';
      
      while ! nc -z kafka-connect-distributed-worker 8083; do
        echo 'Worker port 8083 is still closed, sleeping...';
        sleep 3;
      done;
      
      echo 'SUCCESS: Kafka Connect port 8083 is OPEN!';
      echo 'Executing script now...';
      
      chmod +x /app/configure-connector-for-distributed-worker.sh;
      /bin/sh /app/configure-connector-for-distributed-worker.sh;
      
      echo '=== SETUP CONTAINER FINISHED ===';
      "
    networks:
      - kafka-net
networks:
  kafka-net:
    name: kafka-net
    external: true